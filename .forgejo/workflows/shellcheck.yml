name: Shell lint

# soapcap only runs on macOS 26 (Apple silicon) and depends on yap, Ollama,
# and real audio hardware — none of which this runner has. This workflow is
# static analysis only: syntax and shellcheck, nothing that executes soapcap
# itself.
#
# Forgejo-specific: this runner is Alpine-based with no Docker access, so it
# can't use actions/checkout (needs Node.js) or apt-get (Debian-only). See
# .github/workflows/shellcheck.yml for the GitHub Actions version.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: host
    steps:
      - name: checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="Authorization: Bearer ${GITHUB_TOKEN}" \
            clone --depth=1 --branch "${GITHUB_REF_NAME}" "http://localhost:3000/${GITHUB_REPOSITORY}.git" .

      - name: bash -n syntax check
        run: |
          for f in bin/soapcap install.sh soapcap.command lib/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          apk add --no-cache shellcheck
          shellcheck bin/soapcap install.sh soapcap.command lib/*.sh config.example.sh
