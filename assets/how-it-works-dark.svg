<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
  </defs>
  <rect width="1320" height="500" rx="14" fill="#0b1120"/>

  <!-- the Mac boundary -->
  <rect x="250" y="44" width="1040" height="420" rx="18" fill="#0e1f1b" stroke="#34d399" stroke-width="2.5"/>
  <rect x="274" y="32" width="318" height="26" rx="13" fill="#34d399"/>
  <text x="433" y="50" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.8" fill="#0b1120">ON THIS MAC · NOTHING LEAVES IT</text>

  <!-- sources -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="1.5">
    <rect x="30" y="190" width="180" height="60" rx="10"/>
    <rect x="30" y="290" width="180" height="60" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="216" font-size="14" font-weight="600" fill="#f8fafc">Call audio</text>
    <text x="120" y="234" font-size="11" fill="#94a3b8">Zoom · Meet · Teams · Doxy.me</text>
    <text x="120" y="316" font-size="14" font-weight="600" fill="#f8fafc">Your microphone</text>
    <text x="120" y="334" font-size="11" fill="#94a3b8">your side of the session</text>
  </g>

  <!-- main line -->
  <g fill="none" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#ah)">
    <path d="M210,220 H260 V255 H288"/>
    <path d="M210,320 H260 V285 H288"/>
    <path d="M470,270 H518"/>
    <path d="M680,270 H848"/>
    <path d="M1030,270 H1078"/>
  </g>
  <text x="764" y="290" text-anchor="middle" font-size="11.5" font-style="italic" fill="#94a3b8">straight through</text>

  <!-- live -->
  <rect x="290" y="225" width="180" height="90" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.8"/>
  <g text-anchor="middle">
    <text x="380" y="256" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#f8fafc">soapcap live</text>
    <text x="380" y="277" font-size="11.5" fill="#cbd5e1">Apple SpeechAnalyzer</text>
    <text x="380" y="294" font-size="11.5" fill="#cbd5e1">no audio recorded</text>
  </g>

  <!-- transcript -->
  <rect x="520" y="225" width="160" height="90" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="536" y="246" font-size="10" font-weight="700" letter-spacing="0.8" fill="#94a3b8">TRANSCRIPT</text>
  <g font-family="Menlo, monospace" font-size="12" fill="#f8fafc">
    <text x="536" y="272">Therapist: …</text>
    <text x="536" y="294">Client: …</text>
  </g>

  <!-- optional detour -->
  <g fill="none" stroke="#fb923c" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#aho)">
    <path d="M600,225 V125 H668"/>
    <path d="M860,125 H940 V223"/>
  </g>
  <rect x="670" y="82" width="190" height="86" rx="10" fill="#2b1c0f" stroke="#fb923c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <rect x="729" y="72" width="72" height="20" rx="10" fill="#fb923c"/>
  <text x="765" y="86" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.8" fill="#0b1120">OPTIONAL</text>
  <g text-anchor="middle">
    <text x="765" y="116" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#f8fafc">soapcap deidentify</text>
    <text x="765" y="136" font-size="11.5" fill="#cbd5e1">redacts names and identifiers</text>
    <text x="765" y="153" font-size="11.5" fill="#cbd5e1">OpenMed PII model · best effort</text>
  </g>

  <!-- note -->
  <rect x="850" y="225" width="180" height="90" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.8"/>
  <g text-anchor="middle">
    <text x="940" y="256" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#f8fafc">soapcap note</text>
    <text x="940" y="277" font-size="11.5" fill="#cbd5e1">Ollama or Bonsai</text>
    <text x="940" y="294" font-size="11.5" fill="#cbd5e1">local model</text>
  </g>

  <!-- draft note -->
  <rect x="1080" y="225" width="180" height="90" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="1096" y="246" font-size="10" font-weight="700" letter-spacing="0.8" fill="#94a3b8">DRAFT NOTE</text>
  <g font-family="Menlo, monospace" font-size="12" fill="#f8fafc">
    <text x="1096" y="272">SUBJECTIVE: …</text>
    <text x="1096" y="294">OBJECTIVE: …</text>
  </g>
  <text x="1170" y="336" text-anchor="middle" font-size="11.5" fill="#cbd5e1">shown in the terminal, or copied</text>

  <!-- de-emphasised disk branches -->
  <g fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 4">
    <path d="M600,315 V398"/>
    <path d="M1170,346 V398"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#64748b">
    <text x="600" y="414">saved to a file only if you ask</text>
    <text x="1170" y="414">saved to a file only if you ask</text>
  </g>
</svg>
